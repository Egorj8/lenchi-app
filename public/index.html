<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Lenchi Studio</title>
    <meta name="description" content="Приложение мастера ногтевого сервиса: записи, клиенты, финансы." />
    <meta name="theme-color" content="#1a1b1e" />

    <!-- Установка на экран «Домой» -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lenchi" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #1a1b1e;
      }
      body {
        overflow: hidden;
        /* без подсветки при нажатии и без выделения текста долгим тапом */
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Для работы приложения включите JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
